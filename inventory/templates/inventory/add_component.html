<!DOCTYPE html>
<html>
<head>
    <title>{{ page_title }}</title>
</head>
<body>

    <h1>{{ page_title }}</h1>

    {% if success_message %}
        <p>{{ success_message }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}

        {{ form.as_p }}

        <button type="submit">Add Component</button>
    </form>

    <a href="{% url 'inventory:component-list' %}">
        Back to Component Inventory
    </a>

</body>
</html>
