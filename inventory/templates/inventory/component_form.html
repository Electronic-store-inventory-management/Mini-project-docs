{% extends "base.html" %}

{% block content %}
<h2>Add Component</h2>

{% if messages %}
  <ul class="messages">
  {% for message in messages %}
    <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
  {% endfor %}
  </ul>
{% endif %}

<form method="post" novalidations>
  {% csrf_token %}
  {{ form.non_field_errors }}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Add Component</button>
</form>
{% endblock %}
