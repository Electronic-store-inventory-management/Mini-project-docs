
{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Pagination">

    {% if page_obj.has_previous %}
        <a href="?{% if search_query %}q={{ search_query|urlencode }}&{% endif %}page={{ page_obj.previous_page_number }}">
            Previous
        </a>
    {% endif %}

    <span>
        Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
        ({{ page_obj.paginator.count }} records)
    </span>

    {% if page_obj.has_next %}
        <a href="?{% if search_query %}q={{ search_query|urlencode }}&{% endif %}page={{ page_obj.next_page_number }}">
            Next
        </a>
    {% endif %}

</nav>
{% endif %}
