
<h1>{{ page_title }}</h1>

{% if components %}
<table>
    <thead>
        <tr>
            <th>Component</th>
            <th>Quantity</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        {% for component in components %}
        <tr>
            <td>{{ component }}</td>
            <td>{{ component.quantity }}</td>
            <td><strong>Out of Stock</strong></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% else %}
<p>There are currently no out-of-stock components.</p>
{% endif %}

<p><a href="{% url 'inventory:availability' %}">View all component availability</a></p>
